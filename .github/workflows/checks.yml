name: Local-equivalent checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      TEST_DATABASE_URL: postgresql://postgres:local-fake-data-only@127.0.0.1:55432/privacy_payments
    steps:
      # Official actions refs verified 2026-10-25; immutable commits, no persisted credentials.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Install locked Playwright Chromium
        run: |
          ./node_modules/.bin/playwright install --with-deps chromium
          node --input-type=module -e 'import { chromium } from "@playwright/test"; console.log("CHROMIUM_PATH=" + chromium.executablePath())' >> "$GITHUB_ENV"
      - name: Start disposable loopback PostgreSQL
        run: bash scripts/postgres-local.sh start
      - name: Run all checks
        run: bash scripts/ci.sh
      - name: Remove disposable PostgreSQL
        if: always()
        run: |
          if docker container inspect privacy-payments-postgres >/dev/null 2>&1; then
            bash scripts/postgres-local.sh stop
          fi
